<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Game demos</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 24px;
			background: #000;
			color: #d8e6ff;
			font-family: system-ui, sans-serif;
		}
		h1 { font-weight: 500; letter-spacing: 0.08em; font-size: 20px; color: #8fa6c8; }
		nav { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
		a {
			display: block;
			width: 240px;
			padding: 20px 22px;
			border: 1px solid rgba(110, 170, 255, 0.35);
			border-radius: 8px;
			background: rgba(20, 40, 80, 0.25);
			color: inherit;
			text-decoration: none;
		}
		a:hover { border-color: rgba(110, 170, 255, 0.9); background: rgba(20, 40, 80, 0.5); }
		a strong { display: block; font-size: 20px; margin-bottom: 6px; }
		a span { color: #8fa6c8; font-size: 14px; }
	</style>
</head>
<body>
	<h1>GAME DEMOS</h1>
	<nav>
		<a href="rtl/"><strong>Real-time logistics</strong><span>RTS logistics prototype</span></a>
		<a href="skiff/"><strong>Skiff</strong><span>One ship, a few bots, a flaring star</span></a>
	</nav>
</body>
</html>
