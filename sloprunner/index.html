<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#140c22">
		<title>Sloprunner</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #140c22;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: --p runs 0..1 with the download. */
#status {
	position: absolute;
	inset: 0;
	overflow: hidden;
	visibility: hidden;
	user-select: none;
	transition: opacity 0.5s ease;
	will-change: opacity;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#status-notice {
	display: none;
	position: absolute;
	left: 16px;
	right: 16px;
	bottom: 8%;
	max-width: 560px;
	margin: 0 auto;
	padding: 1rem;
	background-color: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	color: #e0e0e0;
	font: 15px/1.4 system-ui, sans-serif;
	text-align: center;
	z-index: 2;
}

#status {
	background: linear-gradient(#3c2470 0%, #7b3f8f 38%, #c86e98 66%, #ffa66e 100%);
	font-family: 'Luckiest Guy', Impact, sans-serif;
}

.sun {
	position: absolute;
	left: 50%;
	bottom: 16vh;
	width: 60vmin;
	height: 60vmin;
	transform: translate(-50%, 50%);
	border-radius: 50%;
	background: radial-gradient(circle, #ffe7a8 0 22%, rgba(255, 196, 130, 0.5) 38%, rgba(255, 170, 120, 0) 70%);
}

.city {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	background-repeat: repeat-x;
	background-position: 0 100%;
	animation: city 9s linear infinite;
}

@keyframes city {
	to { background-position: var(--w) 100%; }
}

.speed {
	position: absolute;
	left: 50%;
	top: 46%;
}

.speed i {
	position: absolute;
	width: 70vmax;
	height: 2px;
	transform-origin: 0 50%;
	transform: rotate(var(--a));
}

.speed i::after {
	content: '';
	position: absolute;
	inset: 0;
	background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.7));
	transform-origin: 0 50%;
	animation: streak 1.4s cubic-bezier(0.5, 0, 1, 1) infinite;
	animation-delay: var(--d);
	opacity: 0;
}

@keyframes streak {
	0% { transform: translateX(8vmin) scaleX(0.05); opacity: 0; }
	30% { opacity: 0.8; }
	100% { transform: translateX(40vmax) scaleX(0.5); opacity: 0; }
}

.front {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	padding: 0 16px 14vh;
	text-align: center;
}

.title {
	font-size: clamp(44px, 12vw, 132px);
	line-height: 1;
	color: #ffd23f;
	letter-spacing: 0.02em;
	-webkit-text-stroke: 0.14em #2a1340;
	paint-order: stroke fill;
	text-shadow: 0 0.09em 0 #2a1340;
	transform: rotate(-4deg) skewX(-8deg);
	animation: bob 0.5s ease-in-out infinite alternate;
}

@keyframes bob {
	to { transform: rotate(-4deg) skewX(-8deg) translateY(-0.04em); }
}

.tag {
	margin-top: 22px;
	font: 10px/1.8 'Press Start 2P', monospace;
	color: #fff;
	text-shadow: 0 2px 0 #2a1340;
}

.bar {
	position: relative;
	width: min(520px, 100%);
	height: 18px;
	margin-top: 30px;
	border: 4px solid #2a1340;
	border-radius: 14px;
	background: rgba(42, 19, 64, 0.6);
	overflow: hidden;
}

.bar b {
	position: absolute;
	inset: 0;
	width: calc(var(--p) * 100%);
	border-radius: 10px;
	background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.25) 0 8px, rgba(255, 255, 255, 0) 8px 16px), linear-gradient(90deg, #3fe0d0, #ffd23f);
	background-size: 22.6px 100%, 100% 100%;
	animation: stripes 0.6s linear infinite;
	transition: width 0.2s;
}

.busy .bar b {
	width: 100%;
	opacity: 0.35;
}

@keyframes stripes {
	to { background-position: 22.6px 0, 0 0; }
}

#status-caption {
	margin-top: 14px;
	font: 10px 'Press Start 2P', monospace;
	color: #fff;
	text-shadow: 0 2px 0 #2a1340;
}

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const statusCaption = document.getElementById('status-caption');

	let initializing = true;
	let statusMode = '';

	function onProgress(fraction) {

	}

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const f = Math.min(1, current / total);
			statusOverlay.classList.remove('busy');
			statusOverlay.style.setProperty('--p', f.toFixed(4));
			statusCaption.textContent = f >= 1 ? 'GET READY...' : 'LOADING %'.replace('%', Math.floor(f * 100) + '%');
			onProgress(f);
		} else {
			statusOverlay.classList.add('busy');
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 600);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
