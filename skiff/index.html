		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #000000;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: --p runs 0..1 with the download. */
#status {
	position: absolute;
	inset: 0;
	overflow: hidden;
	visibility: hidden;
	user-select: none;
	transition: opacity 0.5s ease;
	will-change: opacity;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#status-notice {
	display: none;
	position: absolute;
	left: 16px;
	right: 16px;
	bottom: 8%;
	max-width: 560px;
	margin: 0 auto;
	padding: 1rem;
	background-color: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	color: #e0e0e0;
	font: 15px/1.4 system-ui, sans-serif;
	text-align: center;
	z-index: 2;
}

#status {
	background-color: #000;
	background-image: linear-gradient(rgba(70, 70, 190, 0.16) 1px, transparent 1px), linear-gradient(90deg, rgba(70, 70, 190, 0.16) 1px, transparent 1px);
	background-size: 80px 80px;
	background-position: center center;
	font-family: 'Chakra Petch', system-ui, sans-serif;
}

.scene {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
}

.flare {
	fill: none;
	stroke: rgba(242, 179, 71, 0.8);
	stroke-width: 2;
	vector-effect: non-scaling-stroke;
	transform-box: fill-box;
	transform-origin: center;
	animation: flare 4s ease-out infinite;
	opacity: 0;
}

.flare.f2 { animation-delay: 0.25s; }
.flare.f3 { animation-delay: 0.5s; }

@keyframes flare {
	0% { transform: scale(0.6); opacity: 0; }
	4% { opacity: 0.9; }
	60% { transform: scale(9); opacity: 0; }
	100% { transform: scale(9); opacity: 0; }
}

.sun {
	transform-box: fill-box;
	transform-origin: center;
	animation: pulse 4s ease-out infinite;
}

@keyframes pulse {
	0% { transform: scale(1.25); }
	30%, 100% { transform: scale(1); }
}

.ship {
	transform-box: fill-box;
	transform-origin: center;
	animation: drift 5s ease-in-out infinite alternate;
}

@keyframes drift {
	from { transform: translate(-6px, 4px) rotate(36deg); }
	to { transform: translate(6px, -4px) rotate(52deg); }
}

.front {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 13vh;
	padding: 0 16px;
	display: flex;
	flex-direction: column;
	align-items: center;
	text-align: center;
}

.title {
	font-size: clamp(40px, 10vw, 96px);
	line-height: 1;
	letter-spacing: 0.4em;
	margin-right: -0.4em;
	color: #f2b347;
	text-shadow: 0 0 30px rgba(242, 179, 71, 0.35);
}

.tag {
	margin-top: 12px;
	font-size: clamp(14px, 2.2vw, 18px);
	color: #9a96b8;
}

.bar {
	position: relative;
	width: min(420px, 100%);
	height: 4px;
	margin-top: 30px;
	background: rgba(120, 120, 220, 0.2);
}

.bar b {
	position: absolute;
	inset: 0;
	width: calc(var(--p) * 100%);
	background: #f2b347;
	transition: width 0.2s;
}

.busy .bar b {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite alternate;
}

@keyframes sweep {
	to { transform: translateX(233%); }
}

#status-caption {
	margin-top: 12px;
	font-size: 13px;
	letter-spacing: 0.25em;
	color: #6f6c93;
	text-transform: uppercase;
}

	const statusCaption = document.getElementById('status-caption');

	let initializing = true;
	let statusMode = '';

	function onProgress(fraction) {

	}

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const f = Math.min(1, current / total);
			statusOverlay.classList.remove('busy');
			statusOverlay.style.setProperty('--p', f.toFixed(4));
			statusCaption.textContent = f >= 1 ? 'Undocking' : 'Charging the bank %'.replace('%', Math.floor(f * 100) + '%');
			onProgress(f);
		} else {
			statusOverlay.classList.add('busy');
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 600);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
