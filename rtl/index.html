		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #000000;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: --p runs 0..1 with the download. */
#status {
	position: absolute;
	inset: 0;
	overflow: hidden;
	visibility: hidden;
	user-select: none;
	transition: opacity 0.5s ease;
	will-change: opacity;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#status-notice {
	display: none;
	position: absolute;
	left: 16px;
	right: 16px;
	bottom: 8%;
	max-width: 560px;
	margin: 0 auto;
	padding: 1rem;
	background-color: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	color: #e0e0e0;
	font: 15px/1.4 system-ui, sans-serif;
	text-align: center;
	z-index: 2;
}

#status {
	background-color: #000;
	background-image: linear-gradient(rgba(70, 70, 190, 0.16) 1px, transparent 1px), linear-gradient(90deg, rgba(70, 70, 190, 0.16) 1px, transparent 1px);
	background-size: 80px 80px;
	background-position: center center;
	font-family: 'Chakra Petch', system-ui, sans-serif;
}

.net {
	position: absolute;
	left: 50%;
	top: 44%;
	width: min(1200px, 100vw);
	transform: translate(-50%, -50%);
	overflow: visible;
}

.edge path {
	fill: none;
	stroke: #8fb4ff;
	stroke-width: 2.5;
	stroke-dasharray: 1;
	stroke-dashoffset: 1;
	transition: stroke-dashoffset 0.25s linear;
}

.edge .flow {
	stroke: #e8f0ff;
	stroke-width: 3;
	stroke-dasharray: 2 14;
	stroke-dashoffset: 0;
	opacity: 0;
	animation: flow 0.8s linear infinite;
	transition: opacity 0.4s;
}

.edge.live .flow {
	opacity: 0.8;
}

@keyframes flow {
	to { stroke-dashoffset: -16; }
}

.node {
	opacity: 0;
	transform-box: fill-box;
	transform-origin: center;
	transform: scale(0.3);
	transition: opacity 0.3s, transform 0.3s cubic-bezier(0.3, 1.8, 0.6, 1);
}

.node.on {
	opacity: 1;
	transform: none;
}

.node rect, .node circle, .node path {
	stroke-width: 3;
}

.relay circle { fill: #0b1430; stroke: #8fb4ff; }
.mine rect { fill: #0b1430; stroke: #8fb4ff; }
.site rect { fill: #2a1406; stroke: #ff9a3c; }
.hub path { fill: #2a2300; stroke: #ffd23a; stroke-width: 5; }
.hub .dot { fill: #ffd23a; stroke: none; }

.hub .halo {
	fill: none;
	stroke: rgba(255, 210, 58, 0.5);
	stroke-width: 2;
	transform-box: fill-box;
	transform-origin: center;
	animation: ping 1.6s ease-out infinite;
}

@keyframes ping {
	from { transform: scale(0.4); opacity: 1; }
	to { transform: scale(1.4); opacity: 0; }
}

.front {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 9vh;
	padding: 0 16px;
	display: flex;
	flex-direction: column;
	align-items: center;
	text-align: center;
}

.title {
	font-size: clamp(40px, 9vw, 88px);
	line-height: 1;
	color: #e8f0ff;
	letter-spacing: 0.04em;
}

.title span {
	color: #ffd23a;
}

.tag {
	margin-top: 10px;
	font-size: clamp(14px, 2.2vw, 18px);
	color: #8a8fb8;
}

#status-caption {
	margin-top: 22px;
	font-size: 13px;
	letter-spacing: 0.25em;
	color: #6f74a0;
	text-transform: uppercase;
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2310452,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const statusCaption = document.getElementById('status-caption');

	let initializing = true;
	let statusMode = '';

	function onProgress(fraction) {
		const edges = statusOverlay.querySelectorAll('.edge');
		edges.forEach((edge, i) => {
			const t = Math.min(1, Math.max(0, fraction * edges.length - i));
			edge.firstElementChild.style.strokeDashoffset = 1 - t;
			edge.classList.toggle('live', t >= 1);
			if (t >= 1) {
				document.getElementById('n-' + edge.dataset.to).classList.add('on');
			}
		});
	}

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const f = Math.min(1, current / total);
			statusOverlay.classList.remove('busy');
			statusOverlay.style.setProperty('--p', f.toFixed(4));
			statusCaption.textContent = f >= 1 ? 'Spawning' : 'Replicating %'.replace('%', Math.floor(f * 100) + '%');
			onProgress(f);
		} else {
			statusOverlay.classList.add('busy');
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 600);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
